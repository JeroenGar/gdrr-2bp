[package]
name = "gdrr_2bp"
version = "1.3.0"
edition = "2024"
rust-version = "1.86"
default-run = "gdrr_main"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
mimalloc = ["dep:mimalloc"]

[dependencies]
rand = "0.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.12.0"
ctrlc = "3.2.2"
colored = "3.0.0"
svg = "0.18.0"
horrorshow = "0.8.4"
itertools = "0.15.0"
ordered-float = "5.0.0"
mimalloc = { version = "0.1", optional = true }
slotmap = "1.1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ci_bench"
harness = false

[[bin]]
name = "gdrr_main"
path = "src/gdrr_main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 2
strip = false
